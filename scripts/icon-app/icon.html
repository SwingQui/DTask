<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
        overflow: hidden;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="squircle">
          <rect x="64" y="64" width="896" height="896" rx="212" />
        </clipPath>
      </defs>

      <g clip-path="url(#squircle)">
        <rect x="64" y="64" width="896" height="896" fill="#202020" />
      </g>
      <rect
        x="65"
        y="65"
        width="894"
        height="894"
        rx="211"
        fill="none"
        stroke="#3a3a3a"
        stroke-width="2"
      />

      <!-- paper plane -->
      <g>
        <path d="M 300 470 L 748 232 L 560 620 Z" fill="#F2F2F2" />
        <path d="M 300 470 L 560 620 L 500 520 Z" fill="#C9C9C9" />
        <path d="M 500 520 L 560 620 L 594 566 Z" fill="#ABABAB" />
        <path
          d="M 748 232 L 560 620"
          fill="none"
          stroke="#BDBDBD"
          stroke-width="6"
          stroke-linecap="round"
        />
      </g>

      <!-- falling task card -->
      <g transform="translate(466 690) rotate(-15)">
        <rect x="-80" y="-54" width="160" height="108" rx="16" fill="#F2F2F2" />
        <rect x="-52" y="-24" width="86" height="10" rx="5" fill="#BDBDBD" />
        <rect x="-52" y="0" width="62" height="10" rx="5" fill="#C9C9C9" />
        <rect x="-52" y="24" width="74" height="10" rx="5" fill="#C9C9C9" />
      </g>

      <!-- tray -->
      <g>
        <path
          d="M 296 800 Q 512 848 728 800 L 672 908 Q 664 924 646 924 L 378 924 Q 360 924 352 908 Z"
          fill="#6FE07C"
        />
        <path d="M 296 800 Q 512 848 728 800 Q 512 816 296 800 Z" fill="#15351C" />
        <path
          d="M 376 872 Q 512 896 648 872"
          fill="none"
          stroke="#2F8A3F"
          stroke-width="6"
          stroke-linecap="round"
          opacity="0.75"
        />
      </g>
    </svg>
  </body>
</html>
